{{ define "main" }}

<article class="post">
  <h1>{{ .Title }}</h1>

  {{ .Content }}

  <div id="search"></div>
</article>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">

<script src="/pagefind/pagefind-ui.js"></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  new PagefindUI({
    element: "#search"
  });
});
</script>

{{ end }}
