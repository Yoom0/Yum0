baseURL = "https://yum0.pages.dev/"
languageCode = "en-us"
title = "YUM0"
theme = "terminal"

defaultContentLanguage = "en"

[outputs]
home = ["HTML", "RSS"]

[params.logo]
logoText = "YUM0"

[params]
description = "A personal archive of stories, research experiences, game journals, essays, satire, and reflections."
keywords = "stories, game journals, political satire, essays, anthropology, research, field work, personal blog, sponsored content"
enableSiteSearch = true
centerTheme = true

[params.author]
name = "Servus Dei Custoditus"
email = "yum0@limbomail.com"
bio = "An undergraduate anthropology student at the University of Dhaka exploring stories, societies, games, research, and everyday experiences."

[markup]

[markup.goldmark]

[markup.goldmark.parser]

[markup.goldmark.parser.attribute]
block = true


# Main navigation

[[menus.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1


[[menus.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 3


[[menus.main]]
identifier = "explore"
name = "Explore"
url = "/explore/"
weight = 2

[[menus.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 4


[[menus.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 5


[[menus.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 6



# Taxonomies

[taxonomies]
category = "categories"
tag = "tags"



# Tailwind / FortyTen requirements

[build]

[build.buildStats]
enable = true


[[build.cachebusters]]
source = "assets/notwatching/hugo_stats\\.json"
target = "css"


[[build.cachebusters]]
source = "(postcss|tailwind)\\.config\\.js"
target = "css"



[module]

[[module.mounts]]
source = "assets"
target = "assets"


[[module.mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
disableWatch = true